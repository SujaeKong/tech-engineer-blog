---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      {{ page.date | date: "%Y년 %m월 %d일" }} |
      카테고리: <code>{{ page.categories | join: ", " }}</code>
      {% if page.source_url %}
      | <a href="{{ page.source_url }}" target="_blank">원문 링크</a>
      {% endif %}
    </p>
    {% if page.tags %}
    <p class="post-tags">
      {% for tag in page.tags %}
      <span class="tag">#{{ tag }}</span>
      {% endfor %}
    </p>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>

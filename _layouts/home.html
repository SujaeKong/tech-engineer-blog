---
layout: default
---

<div class="home">
  {{ content }}

  <h2>최근 포스트</h2>
  <ul class="post-list">
    {% for post in site.posts limit:20 %}
    <li>
      <span class="post-meta">{{ post.date | date: "%Y-%m-%d" }} | <code>{{ post.categories | join: ", " }}</code></span>
      <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
      <p>{{ post.excerpt | strip_html | truncate: 150 }}</p>
    </li>
    {% endfor %}
  </ul>
</div>

name: "Cafe Exam-Prediction Post"

# 140회 출제예상 카드 10개를 카페 '출제예상문제' 게시판에 한 카드당 1글씩 게시.
# naver.com이 열려 있는 GitHub 서버에서 게시한다.
#  - workflow_dispatch: 수동 실행(list_menus/dry_run/post 선택)
#  - push: _data/exam_cafe_trigger.txt 가 갱신되면 자동 post 실행
#          (성공한 카드는 _data/exam_cafe_posted.json 에 기록되어 재실행 시 skip)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        required: true
        default: dry_run
        options:
          - list_menus   # 카페 게시판 목록 조회(menu id 확인용)
          - dry_run      # 게시 없이 미리보기
          - post         # 실제 게시
      menu_id:
        description: "출제예상문제 게시판 menu id (기본값=137)"
        type: string
        required: false
        default: "137"
  push:
    branches: [master]
    paths:
      - "_data/exam_cafe_trigger.txt"

permissions:
  contents: write

jobs:
  exam-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run exam-prediction cafe poster
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_REFRESH_TOKEN: ${{ secrets.NAVER_REFRESH_TOKEN }}
          # push 트리거는 inputs가 비어 있으므로 post / 137 로 기본 동작
          EXAM_MENU_ID: ${{ github.event.inputs.menu_id || '137' }}
          MODE: ${{ github.event.inputs.mode || 'post' }}
        run: |
          case "$MODE" in
            list_menus) python3 scripts/post_exam_predictions_to_cafe.py --list-menus ;;
            dry_run)    python3 scripts/post_exam_predictions_to_cafe.py --dry-run ;;
            post)       python3 scripts/post_exam_predictions_to_cafe.py ;;
          esac

      - name: Commit posted-state (성공 카드 기록 → 재게시 방지)
        # 일부 카드가 실패해 게시 스텝이 exit 1 이어도, 성공분은 반드시 기록한다.
        if: ${{ always() && (github.event.inputs.mode || 'post') == 'post' }}
        run: |
          git add _data/exam_cafe_posted.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: record exam-prediction cafe posts"
            git push
          fi
